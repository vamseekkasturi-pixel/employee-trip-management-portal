<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Trip Portal{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<nav><span class="brand">✈ Employee Trip Management Portal</span>
{% if session.user_id %}
<a href="{{ url_for('dashboard') }}">My Trips</a>
<a href="{{ url_for('new_trip') }}">New Request</a>
{% if session.role == 'manager' %}<a href="{{ url_for('manage') }}">Approvals</a>{% endif %}
<span>{{ session.name }}</span><a href="{{ url_for('logout') }}">Logout</a>
{% endif %}</nav>
<main>
{% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
{% block content %}{% endblock %}
</main></body></html>
