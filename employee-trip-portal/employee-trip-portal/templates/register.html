{% extends "base.html" %}{% block content %}
<div class="card narrow"><h2>Register</h2>
<form method="post">
<label>Full name</label><input name="name" required>
<label>Email</label><input type="email" name="email" required>
<label>Department</label><input name="department">
<label>Password</label><input type="password" name="password" minlength="6" required><br><br>
<button>Register</button> <a href="{{ url_for('login') }}">Back to login</a></form></div>
{% endblock %}
